# thinRoot boot server container build
#
# - pull requests/pushes touching the container: build (without release
#   images) and run the smoke test
# - published releases: build the container with the release images of that
#   release and push it to ghcr.io/jens-maus/thinroot
# - manual runs: (re)build and push the container for a given release, e.g.
#   after changes to the container itself
#
# yamllint disable rule:truthy
---
name: Container Build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'thinRoot release to package (YYYYMMDD, empty = latest release)'
        required: false
        default: ''
      push:
        description: 'Push the images to ghcr.io?'
        type: boolean
        default: true
      latest:
        description: 'Update the latest/latest-x86_64 tags?'
        type: boolean
        default: true
  push:
    paths:
      - 'docker/**'
      - 'tftpboot/thinroot/conf/**'
      - 'tftpboot/boot/pxe-banner.png'
      - '.github/workflows/container.yml'
  pull_request:
    paths:
      - 'docker/**'
      - 'tftpboot/thinroot/conf/**'
      - 'tftpboot/boot/pxe-banner.png'
      - '.github/workflows/container.yml'

# default read-only permission
permissions:
  contents: read

env:
  IMAGE: ghcr.io/jens-maus/thinroot
  PLATFORMS: linux/amd64,linux/arm64,linux/arm/v7

jobs:
  test:
    name: Build + smoke test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Create dummy release images
        run: |
          mkdir -p payload
          for f in generic-x86_64 rpi4 rpi4-kernel; do
            echo "dummy ${f}" >"payload/thinroot-19700101-${f}.img"
          done

      - name: Build test image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          build-contexts: payload=payload
          build-args: THINROOT_VERSION=19700101
          load: true
          tags: thinroot:test

      - name: Smoke test
        run: docker/tests/smoke-test.sh thinroot:test 19700101

  publish:
    name: Publish [${{ matrix.flavor }}]
    if: |
      github.repository == 'jens-maus/thinRoot' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'release' && !endsWith(github.event.release.tag_name, '-draft')))
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write      # docker/build-push-action
      id-token: write      # actions/attest-build-provenance
      attestations: write  # actions/attest-build-provenance

    strategy:
      fail-fast: false
      matrix:
        include:
          # all platforms: generic-x86_64 + Raspberry Pi kernel/initrd images
          - flavor: all
            suffix: ''
            patterns: >-
              thinroot-*-generic-x86_64.img*
              thinroot-*-rpi?.img*
              thinroot-*-rpi?-kernel.img*
          # x86_64 clients only
          - flavor: x86_64
            suffix: '-x86_64'
            patterns: >-
              thinroot-*-generic-x86_64.img*

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Determine version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_LATEST: ${{ github.event.inputs.latest }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
            VERSION="${RELEASE_TAG}"
            LATEST=$([[ "${RELEASE_PRERELEASE}" == "true" ]] && echo false || echo true)
          else
            VERSION="${INPUT_VERSION}"
            if [[ -z "${VERSION}" ]]; then
              VERSION=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)
            fi
            LATEST="${INPUT_LATEST}"
          fi
          if [[ ! "${VERSION}" =~ ^[0-9]{8}$ ]]; then
            echo "::error::invalid thinRoot version '${VERSION}'"
            exit 1
          fi
          echo "version=${VERSION}" >>"${GITHUB_OUTPUT}"
          echo "latest=${LATEST}" >>"${GITHUB_OUTPUT}"
          echo "sha7=${GITHUB_SHA::7}" >>"${GITHUB_OUTPUT}"

      - name: Download release images
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          PATTERNS: ${{ matrix.patterns }}
        run: |
          mkdir -p payload
          ARGS=()
          set -f  # the patterns are for gh, not for the shell
          for p in ${PATTERNS}; do
            ARGS+=(--pattern "${p}")
          done
          set +f
          gh release download "${VERSION}" --repo "${GITHUB_REPOSITORY}" --dir payload "${ARGS[@]}"
          cd payload
          ls -la
          sha256sum -c ./*.sha256
          test -f "thinroot-${VERSION}-generic-x86_64.img"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        if: github.event_name == 'release' || github.event.inputs.push == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
            suffix=${{ matrix.suffix }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=${{ steps.version.outputs.version }}-${{ steps.version.outputs.sha7 }}
            type=raw,value=latest,enable=${{ steps.version.outputs.latest }}
          labels: |
            org.opencontainers.image.title=thinRoot
            org.opencontainers.image.description=thinRoot network boot server (PXE/TFTP/HTTP/DHCP) including the thinRoot ${{ steps.version.outputs.version }} release images
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          annotations: |
            org.opencontainers.image.title=thinRoot
            org.opencontainers.image.description=thinRoot network boot server (PXE/TFTP/HTTP/DHCP) including the thinRoot ${{ steps.version.outputs.version }} release images
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index

      - name: Build and push container image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          build-contexts: payload=payload
          build-args: THINROOT_VERSION=${{ steps.version.outputs.version }}
          platforms: ${{ env.PLATFORMS }}
          push: ${{ github.event_name == 'release' || github.event.inputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}

      - name: Attest container provenance
        if: github.event_name == 'release' || github.event.inputs.push == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
